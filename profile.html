<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CreativeHub MMU - Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <div class="logo">
      <img src="mmulogo.png" alt="MMU Logo">
      <h1>CreativeHub MMU</h1>
    </div>
    <ul>
      <li><a href="homepage.html">Home</a></li>
      <li><a href="upload.html">Upload</a></li>
      <li><a href="chatroom.html">Chatroom</a></li>
      <li><a href="profile.html" class="active">Profile</a></li>
      <li><a href="login.html">Logout</a></li>
    </ul>
  </nav>

  <main class="profile">
    <div class="status-controls">
      <button onclick="setStatus('online')">Online</button>
      <button onclick="setStatus('busy')">Busy</button>
      <button onclick="setStatus('afk')">AFK</button>
      <button onclick="setStatus('invisible')">Invisible</button>
    </div>

    <h2 id="profileTitle">Profile</h2>
    <p id="profileInfo">Loading user info...</p>

    <h3>Your Posts</h3>
    <section id="userPosts" class="grid">
      <div class="art-card">
        <p>Example post content goes here...</p>
        <small>Posted on 28 June 2026</small>
        <div class="post-actions">
          <button class="like-btn">👍 Like</button>
          <button class="dislike-btn">👎 Dislike</button>
        </div>
      </div>
    </section>

    <h3>Friends</h3>
    <ul id="friendsList">
      <li>Friend 1</li>
      <li>Friend 2</li>
    </ul>

    <div class="add-friend">
      <input type="text" id="friendName" placeholder="Enter username to add">
      <button class="add-friend-btn">Add Friend</button>
    </div>
  </main>

  <footer>
    <p>© 2026 CreativeHub MMU | About | Contact | MMU Art Events</p>
  </footer>

  <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
  <script src="profile.js"></script>
</body>
</html>
