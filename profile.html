<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <div class="logo">
      <img src="mmulogo.png" alt="MMU Logo">
      <h1>CreativeHub MMU</h1>
    </div>
    <ul>
      <li><a href="homepage.html">Home</a></li>
      <li><a href="upload.html">Upload</a></li>
      <li><a href="chatroom.html">Chatroom</a></li>
      <li><a href="profile.html" class="active">Profile</a></li>

  <main class="profile">
    <div class="status-controls">
      <button onclick="setStatus('online')">Online</button>
      <button onclick="setStatus('busy')">Busy</button>
      <button onclick="setStatus('afk')">AFK</button>
      <button onclick="setStatus('invisible')">Invisible</button>
    </div>

    <h2 id="profileTitle">Profile</h2>
    <p id="profileInfo">Loading user info...</p>

    <h3>Your Posts</h3>
    <section id="userPosts" class="grid"></section>
  </main>

  <footer>
    <p>© 2026 CreativeHub MMU | About | Contact | MMU Art Events</p>
  </footer>

  <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
